spring.application.name=SpringBootCrud

# Banco H2 em memoria (os dados somem quando a aplicacao para)
spring.datasource.url=jdbc:h2:mem:estudosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:estudosdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Roda o data.sql depois que o Hibernate cria as tabelas
spring.jpa.defer-datasource-initialization=true

# Fecha a conexao no fim do service, e nao no fim da requisicao (evita o warning do open-in-view)
spring.jpa.open-in-view=false
